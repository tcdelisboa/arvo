# Render blueprint: one web service, one Postgres database, secrets generated for you.
# In Render: New > Blueprint > pick this repository.
databases:
  - name: arvo-db
    plan: free

services:
  - type: web
    name: arvo
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: arvo-db
          property: connectionString
      - key: APP_SECRET
        generateValue: true
