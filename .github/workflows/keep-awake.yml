# Visits the site every 10 minutes so the free Render instance does not sleep.
# The health route does not touch the database, so Neon can still suspend.
# Render's 750 free instance hours a month cover one service running all month.
name: Keep awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the health route
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://arvo-o9o5.onrender.com/api/health
